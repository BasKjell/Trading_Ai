[system]
seed = 20261106
initial_cash = 10000.0
currency = "EUR"
mode = "offline"

[risk]
# Provisional paper-trading protection values (project spec section 10), not proven optimal.
risk_per_trade = 0.002          # planned stop risk per trade: 0.20 % of current equity
max_risk_per_trade = 0.002
max_open_risk = 0.01            # sum of planned stop risk of open positions: 1 %
daily_loss_limit = 0.015
drawdown_reduce = 0.05          # >= 5 %: halve risk budget
drawdown_block_new = 0.08       # >= 8 %: no new positions
drawdown_kill = 0.10            # >= 10 %: kill switch, controlled de-risking, manual review
max_total_exposure = 1.0        # no leverage
max_instrument_weight = 0.20
max_etf_weight = 0.20
max_stock_weight = 0.10
max_crypto_weight = 0.05
max_crypto_exposure = 0.10
max_group_weight = 0.40         # correlated instruments (see [correlation_groups])
min_order_value = 50.0          # in account currency
max_volume_participation = 0.05 # of the execution bar's volume

[correlation_groups]
SPY = "us_equity_index"
QQQ = "us_equity_index"
AAPL = "us_large_cap_tech"
MSFT = "us_large_cap_tech"
NVDA = "us_large_cap_tech"
BTC-USD = "crypto"
ETH-USD = "crypto"
DAX = "de_equity_index"

[costs]
equity_fee_bps = 0.10
equity_spread_bps = 2.0
equity_slippage_bps = 1.0
equity_min_fee = 0.0
crypto_fee_bps = 10.0
crypto_spread_bps = 8.0
crypto_slippage_bps = 4.0
crypto_min_fee = 0.0

[strategies.etf_trend]
enabled = true
fast_window = 50
slow_window = 200
breakout_window = 55
atr_window = 20
stop_atr = 3.0

[strategies.stock_momentum]
enabled = true
trend_window = 200
momentum_window = 126
skip_recent = 21
atr_window = 20
stop_atr = 3.0
top_n = 2

[strategies.crypto_trend]
enabled = true
fast_window = 50
slow_window = 200
breakout_window = 55
atr_window = 20
stop_atr = 3.5

[backtest]
warmup_bars = 220
stress_cost_multiplier = 2.0

[research]
min_median_return = 0.0
min_median_sharpe = 0.0
min_cost_3x_return = 0.0
min_positive_fold_ratio = 0.55
min_median_trades = 5.0

[data.alpaca]
requests_per_minute = 180
max_attempts = 6
max_estimated_bars = 1000000
historical_feed = "sip"

[paper]
state_path = "state/paper_state.json"
audit_path = "state/audit.jsonl"
paused = false

# Intraday instruments. Costs are modelled assumptions, not measured broker costs.
[instruments.DAX]
market = "index"
venue = "CFD on DAX 40 (broker-quoted)"
currency = "EUR"
session_timezone = "Europe/Berlin"
session_start = "09:00"
session_end = "17:30"
fee_bps = 0.0                   # typical CFD: no commission, cost is in the spread
spread_bps = 1.0                # ~1.5 index points at 15,000 during Xetra hours (assumption)
slippage_bps = 0.5
min_fee = 0.0
qty_step = 0.1                  # 0.1 contract of 1 EUR/point
financing_rate_annual = 0.05    # long overnight financing (reference rate + markup, assumption)

# US index ETFs via Alpaca (T-018, ADR 0005). Data: Alpaca SIP 15-minute bars as traded (raw), regular
# session of each day only; cash dividends booked separately. Alpaca charges no commission; fee_bps
# approximates SEC/FINRA fees on sells.
# Prices are in USD and are treated 1:1 as account currency until T-011 adds FX (known limitation).
[instruments.SPY]
market = "etf"
venue = "NYSE Arca via Alpaca"
currency = "USD"
session_timezone = "America/New_York"
session_start = "09:30"
session_end = "16:00"
fee_bps = 0.1
spread_bps = 0.5                # typical 1 cent at ~500 USD is 0.2 bp; doubled as a margin
slippage_bps = 1.0
min_fee = 0.0
qty_step = 0.001                # fractional shares (Alpaca, market day orders)
financing_rate_annual = 0.0     # cash account, no margin
data_file = "data/SPY_15m.csv"   # raw, as traded (execution, signals, valuation)
data_source = "alpaca_sip_raw"
data_timezone = "UTC"
corporate_actions = "dividends_file"  # data/<SYMBOL>_dividends.csv from fetch-intraday
dividend_withholding = 0.15     # US withholding with W-8BEN treaty rate (assumption)
session_calendar = "nyse"       # early closes; days after the covered range are not traded

[instruments.QQQ]
market = "etf"
venue = "Nasdaq via Alpaca"
currency = "USD"
session_timezone = "America/New_York"
session_start = "09:30"
session_end = "16:00"
fee_bps = 0.1
spread_bps = 0.5
slippage_bps = 1.0
min_fee = 0.0
qty_step = 0.001
financing_rate_annual = 0.0
data_file = "data/QQQ_15m.csv"   # raw, as traded (execution, signals, valuation)
data_source = "alpaca_sip_raw"
data_timezone = "UTC"
corporate_actions = "dividends_file"  # data/<SYMBOL>_dividends.csv from fetch-intraday
dividend_withholding = 0.15     # US withholding with W-8BEN treaty rate (assumption)
session_calendar = "nyse"       # early closes; days after the covered range are not traded

# Final independent test period, fixed before the first evaluation of the ETF data (T-018, ADR 0005).
# Rows not completely available before `start` are withheld at import (only their count is reported).
# `--use-holdout` is a convention logged in the report, not yet an access control (planned: T-008).
# Do not move this date after looking at results.
[holdout]
start = "2025-11-01T00:00:00+00:00"

[intraday]
signal_interval_minutes = 15
data_file = "data/DAX3015.csv"
data_symbol = "DAX"
data_source = "dax3015_csv"
data_timezone = "Europe/Athens"

[strategies.intraday_trend]
enabled = true
trend_window_hours = 50
breakout_bars = 16
exit_bars = 8
atr_bars = 14
stop_atr = 2.5
max_hold_bars = 0

[strategies.mean_reversion]
enabled = true
reference_bars = 20
entry_z = 2.0
trend_filter_bars = 32
max_efficiency = 0.30
atr_bars = 14
stop_atr = 2.0
max_hold_bars = 16
