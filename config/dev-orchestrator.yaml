# Copy outside the clone and set a private, absolute state directory.
repository: BasKjell/Trading_Ai
state_directory: ~/.trading-ai/dev-orchestrator
execution_enabled: false
merge_enabled: false
image: ""
required_check: check
poll_seconds: 60
timeout_seconds: 1800
cooldown_seconds: 18000
max_age_seconds: 172800
max_tasks: 20
max_corrections: 3
max_quota_pauses: 5
output_bytes: 2000000
diff_bytes: 100000
file_bytes: 2000000
pids: 128
memory: 4g
scratch: 2g
cpus: 2
codex:
  model: gpt-6.2-sol
  proxy: http://egress-codex:3128
  network: trading-dev-codex
  auth_volume: trading-dev-codex-auth
  # Optional: seccomp_profile (absolute controller-local path) and seccomp_sha256.
claude:
  model: claude-opus-5-5
  proxy: http://egress-claude:3128
  network: trading-dev-claude
  auth_volume: trading-dev-claude-auth
# Agentgateway (T-025): OpenAI-compatible entry point for local and external models. It runs as container
# "agentgateway" on its own internal network and reaches Ollama on a second internal network.
gateway:
  url: http://agentgateway:4000
  network: trading-dev-gateway
# Roles: provider account, model family (independence rule) and effort (low | medium | high).
# Gateway roles use the aliases from config/agentgateway.yaml, never concrete model names.
roles:
  codex-medium:
    provider: codex
    family: openai
    effort: medium
  claude-medium:
    provider: claude
    family: anthropic
    effort: medium
  claude-high:
    provider: claude
    family: anthropic
    effort: high
  local-coder:
    provider: gateway
    model: local-coder
    family: qwen
    effort: high
  local-reviewer:
    provider: gateway
    model: local-reviewer
    family: gemma
    effort: medium
  local-doku:
    provider: gateway
    model: local-doku
    family: qwen
    effort: low
    reasoning: true          # qwen3 has a thinking mode; the effort is sent as reasoning_effort
# Default author role; label "agent:<role>" on an issue selects another author role.
author: codex-medium
# Reviewer preference: the first role from a different model family than the author reviews.
reviewers: [claude-medium, codex-medium, local-reviewer]
tasks: {}
# Example entry (use the actual issue, reviewed scope and dependencies):
# tasks:
#   T-099:
#     class: U
#     priority: 10
#     depends_on: [5]
#     paths: [docs/REPORTS.md]
#     draft_role: local-coder   # optional: local first draft for the author
#     hint_role: local-doku      # optional: local pre-review hints for the reviewer
